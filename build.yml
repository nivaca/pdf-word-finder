name: Construir y publicar

# PyInstaller no compila para otros sistemas: hay que ejecutarlo en cada uno.
# Este flujo de trabajo lo hace por usted en las máquinas de GitHub, de modo
# que no necesita tener a mano un Windows y un Mac.
#
# Al publicar una etiqueta (v1.0, v1.1…) construye los tres ejecutables, los
# empaqueta y crea una «release» con ellos adjuntos. Lanzado a mano desde la
# pestaña «Actions», construye igual pero no publica nada: los resultados
# quedan como artefactos temporales, útiles para probar antes de etiquetar.

on:
  push:
    # Se admiten las dos convenciones: «v1.2» y «1.2» a secas. El
    # repositorio venía usando la segunda.
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write     # necesario para crear la release

jobs:
  construir:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
            sufijo: windows-x64
          - os: macos-latest
            nombre: macOS (Apple Silicon)
            sufijo: macos-arm64
          - os: macos-13
            nombre: macOS (Intel)
            sufijo: macos-x64
          - os: ubuntu-22.04
            nombre: Linux
            sufijo: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pypdf

      - name: Comprobar que la etiqueta y la versión concuerdan
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # Una etiqueta v1.3 sobre un código que se anuncia como 1.2 produce
          # descargas que mienten sobre sí mismas. Más vale fallar aquí.
          # (Sin tildes en los nombres de variable: bash no las admite.)
          etiqueta="${GITHUB_REF_NAME#v}"
          version=$(python -c "import pdf_word_finder as m; print(m.__version__)")
          echo "etiqueta: $etiqueta / __version__: $version"
          test "$etiqueta" = "$version"

      - name: Construir
        run: pyinstaller --clean --noconfirm pdf_word_finder.spec

      - name: Añadir la documentación
        shell: bash
        run: |
          # En modo carpeta todo cuelga de dist/pdf-word-finder/; la
          # documentación va dentro, para que viaje con el programa.
          cp README.md LICENSE dist/pdf-word-finder/

      # El empaquetado va por sistema: cada uno tiene su formato esperado y,
      # en el caso de macOS, su exigencia técnica.
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\pdf-word-finder -DestinationPath pdf-word-finder-${{ matrix.sufijo }}.zip

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          # ditto y no zip: el paquete .app contiene enlaces simbólicos que
          # zip convierte en copias, y la aplicación resultante no abre.
          ditto -c -k --sequesterRsrc --keepParent dist/pdf-word-finder.app pdf-word-finder-${{ matrix.sufijo }}.zip

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: tar -czf pdf-word-finder-${{ matrix.sufijo }}.tar.gz -C dist pdf-word-finder

      - name: Guardar el paquete como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pdf-word-finder-${{ matrix.sufijo }}
          path: pdf-word-finder-${{ matrix.sufijo }}.*

      - name: Adjuntarlo a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pdf-word-finder-${{ matrix.sufijo }}.*
          generate_release_notes: true
          draft: true          # se publica a mano, tras comprobar los archivos
          body: |
            Ejecutables autónomos para Windows, macOS y Linux. No requieren
            Python ni bibliotecas: basta descomprimir la carpeta entera y
            ejecutar lo que hay dentro. La carpeta no se puede deshacer: los
            programas necesitan las bibliotecas que la acompañan.

            **Los ejecutables no están firmados.** Windows mostrará un aviso
            de «editor desconocido» (Más información → Ejecutar de todas
            formas). En macOS hay que abrir la aplicación con clic derecho →
            Abrir la primera vez. En Linux, `chmod +x`.

            Quien tenga Python instalado puede prescindir de estos paquetes y
            usar directamente los archivos `.py` del código fuente.
